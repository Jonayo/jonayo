<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J Downloader · DL</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --paper:#F0EEE6; --ink:#1A1B1E; --muted:#6B6B63; --line:#D8D4C8; --accent:#FF5A1F; --accent-ink:#FFF3EC; --blue:#2451FF; --card:#FAF9F5; --dark:#08080B; --sur:#1E1E26; --sur2:#2A2A34; }
*{box-sizing:border-box;margin:0;padding:0} body{background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55}
.hero{background:radial-gradient(1200px 600px at 50% -20%, #1c1c24 0%, var(--dark) 60%);text-align:center;padding:28px 20px 20px;border-bottom:1px solid var(--line)}
.hero h1{color:#fff;font-size:26px;font-weight:700} .hero h1 span{color:var(--accent)} .hero p{color:#c9c9c3;font-family:'Space Mono',monospace;font-size:12.5px;margin-top:6px}
main{max-width:780px;margin:0 auto;padding:20px 16px 80px}
.search-wrap{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;gap:10px;align-items:center}
.search-wrap input{flex:1;border:none;outline:none;font-size:15px;background:transparent;font-family:'Inter',sans-serif}
.search-wrap input::placeholder{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);font-family:'Space Mono',monospace;font-size:12.5px;font-weight:700;cursor:pointer}
.chip.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.status{font-family:'Space Mono',monospace;font-size:12.5px;color:var(--muted);margin:12px 4px;min-height:18px}
.results{display:flex;flex-direction:column;gap:10px}
.card-result{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;gap:12px;cursor:pointer;transition:border-color .15s}
.card-result:hover{border-color:var(--accent)}
.thumb{width:148px;height:84px;border-radius:8px;background:#111;object-fit:cover;flex:none}
.info{flex:1;min-width:0}
.info h3{font-size:14px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.info .meta{font-size:12.5px;color:var(--muted);margin-top:4px}
.info .chan{font-size:12px;color:var(--muted)}
.btn{font-family:'Space Mono',monospace;font-weight:700;font-size:13px;background:var(--accent);color:var(--accent-ink);border:none;padding:10px 18px;border-radius:8px;cursor:pointer}
.btn:hover{background:#e34a10}
.btn-ghost{background:var(--sur2);color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.open{display:flex}
.modal-card{background:var(--card);border-radius:14px;max-width:520px;width:100%;max-height:85vh;overflow:auto;padding:18px}
.q-btn{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-family:'Space Mono',monospace;font-size:13px;font-weight:700;cursor:pointer;display:flex;justify-content:space-between;margin-top:8px}
.q-btn:hover{border-color:var(--accent);background:#FFF3EC}
.player-wrap{margin-top:16px}
.player-wrap video{width:100%;border-radius:10px;background:#000;max-height:420px}
.foot{text-align:center;margin-top:18px;font-size:12px;color:var(--muted);font-family:'Space Mono',monospace}
.foot a{color:var(--blue)}
</style>
</head>
<body>
<div class="hero">
  <h1><span>J</span> Downloader</h1>
  <p>Busca, reproduce sin anuncios y descarga — hasta 4K · MP4 / MP3</p>
</div>
<main>
  <div class="search-wrap">
    <span style="font-size:18px">🔍</span>
    <input id="q" type="text" placeholder="Buscar videos en YouTube...">
    <button class="btn" id="btn-search" onclick="buscar()">Buscar</button>
  </div>
  <div class="chips" id="chips">
    <button class="chip" data-q="videos trending argentina 2026">🔥 Tendencias</button>
    <button class="chip" data-q="videos musicales 2026">🎵 Videos Musicales</button>
    <button class="chip" data-q="mejores momentos gaming">🎮 Gaming</button>
    <button class="chip" data-q="noticias de hoy">📰 Noticias</button>
    <button class="chip" data-q="en vivo ahora">🔴 En directo</button>
  </div>
  <div class="status" id="status">Tip: pega un link de YouTube o busca por nombre.</div>
  <div class="results" id="results"></div>
  <div class="foot"><a href="https://github.com/Jonayo/jonayodownloader-apk/releases/latest/download/jonayo-app.apk">Descargar APK Android</a> · <a href="/">Volver al inicio</a></div>
</main>

<div class="modal" id="modal" onclick="if(event.target===this) cerrar()">
  <div class="modal-card">
    <h3 id="m-title" style="font-size:16px;line-height:1.3"></h3>
    <p id="m-chan" style="font-size:12.5px;color:var(--muted);margin-top:4px"></p>
    <div class="player-wrap" id="m-player-wrap" style="display:none"><video id="m-video" controls playsinline></video><p style="font-size:11px;color:var(--muted);font-family:'Space Mono',monospace;margin-top:6px">Reproducción sin anuncios — stream directo</p></div>
    <div id="m-qualities" style="margin-top:14px"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-ghost" onclick="cerrar()" style="flex:1">Cerrar</button>
    </div>
  </div>
</div>

<script>
const $ = id=>document.getElementById(id);
let currentVideo=null;

document.getElementById('q').addEventListener('keydown', e=>{ if(e.key==='Enter') buscar(); });
document.querySelectorAll('.chip').forEach(c=> c.addEventListener('click', ()=>{ document.getElementById('q').value=c.dataset.q; document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); buscar(); }));

async function buscar(){
  const q=$('q').value.trim();
  const status=$('status'), results=$('results');
  if(!q){ status.textContent='Escribe algo para buscar.'; return; }
  status.textContent='Buscando...'; results.innerHTML='';
  try{
    // si es URL directa, abrir modal directo sin buscar
    if(q.includes('youtu')){
      abrirModal({title:q, channel:'', duration:'', thumb:'', url:q});
      status.textContent='Link detectado — elige calidad.';
      return;
    }
    const r=await fetch('/api/search?q='+encodeURIComponent(q));
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Error');
    const items=j.items||[];
    if(!items.length){ status.textContent='Sin resultados.'; return; }
    status.textContent=items.length+' resultados';
    results.innerHTML='';
    items.forEach(it=>{
      const el=document.createElement('div');
      el.className='card-result';
      el.innerHTML=`<img class="thumb" src="${it.thumb||''}" loading="lazy" onerror="this.style.background='#222'"><div class="info"><h3>${esc(it.title)}</h3><div class="meta">${esc(it.duration||'')} · ${esc(it.channel||'')}</div><div style="margin-top:8px"><span style="font-family:Space Mono,monospace;font-size:12px;background:var(--ink);color:var(--paper);padding:2px 7px;border-radius:4px">▶ Reproducir</span> <span style="font-family:Space Mono,monospace;font-size:12px;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:4px;margin-left:6px">⬇ Descargar</span></div></div>`;
      el.onclick=()=> abrirModal(it);
      results.appendChild(el);
    });
  }catch(e){ status.textContent='Error: '+(e.message||e); }
}
function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

async function abrirModal(it){
  currentVideo=it;
  $('m-title').textContent=it.title||'Video';
  $('m-chan').textContent=(it.channel||'') + (it.duration?' · '+it.duration:'');
  $('m-qualities').innerHTML='<p style="font-family:Space Mono,monospace;font-size:12.5px;color:var(--muted)">Detectando calidades disponibles...</p>';
  $('m-player-wrap').style.display='none';
  $('modal').classList.add('open');
  try{
    const r=await fetch('/api/info?url='+encodeURIComponent(it.url));
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Error');
    const box=$('m-qualities'); box.innerHTML='';
    // preview sin anuncios con el primer formato de video
    const firstVideo=(j.formats||[]).find(f=>f.vcodec!=='none' && f.url);
    if(firstVideo){
      const v=$('m-video'); v.src=firstVideo.url; v.crossOrigin='anonymous'; $('m-player-wrap').style.display='block'; v.onerror=()=>{ v.poster=''; document.getElementById('m-player-wrap').innerHTML='<p style="font-size:12px;color:var(--muted)">La previsualización directa está bloqueada por YouTube. Usa el botón Descargar para ver el video sin anuncios.</p>'; };
    }
    (j.formats||[]).forEach(f=>{
      const b=document.createElement('button');
      b.className='q-btn';
      const label = f.quality + ' · ' + (f.ext||'mp4').toUpperCase();
      const isAudio = f.vcodec==='none';
      b.innerHTML=`<span>${label}</span><span style="color:var(--accent)">⬇ Descargar</span>`;
      b.onclick=()=>{
        if(f.url){
          if(isAudio || f.vcodec==='none'){
            // audio: descarga directa
            const a=document.createElement('a'); a.href=f.url; a.target='_blank'; a.download=''; a.click();
          } else {
            // video: descarga directa + preview
            const a=document.createElement('a'); a.href=f.url; a.target='_blank'; a.download=''; a.click();
            const v=$('m-video'); v.src=f.url; $('m-player-wrap').style.display='block'; v.play().catch(()=>{});
          }
        }
      };
      box.appendChild(b);
    });
    if((j.formats||[]).length===0) box.innerHTML='<p style="color:var(--muted);font-size:13px">No se encontraron calidades.</p>';
  }catch(e){ $('m-qualities').innerHTML='<p style="color:#c00;font-size:13px">Error: '+esc(e.message||e)+'</p>'; }
}
function cerrar(){ $('modal').classList.remove('open'); const v=$('m-video'); v.pause(); v.removeAttribute('src'); }
</script>
</body>
</html>
