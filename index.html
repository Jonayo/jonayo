  .tagline{

  .tagline .cursor{
    display:inline-block;
    width:8px; height:14px;
    background:#c9c9c3;
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite;

  main{

    opacity:0;

  .post:hover{ border-color:#c7c2b2; box-shadow:0 6px 20px rgba(26,27,30,0.07); }
  @keyframes rise{ to{ opacity:1; transform:translateY(0);} }

  .post-top{

    text-align:center;

  .post-logo{

    height:auto;
    display:block;
    margin:0 auto 18px;
    border-radius:8px;

  .post-body{ padding:20px 24px 0; }

  .post-meta{

    gap:10px;
    font-family:'Space Mono', monospace;
    font-size:12.5px;

    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .download-btn{

    font-weight:700;
    font-size:13.5px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;

  footer{

    padding:30px 20px 50px;
    color:var(--muted);
    font-family:'Space Mono', monospace;
    font-size:12px;
  }

  .empty{
    font-family:'Space Mono', monospace;
    color:var(--muted);
    padding:40px 0;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .post{ animation:none; opacity:1; transform:none; }
    .cursor, .ping{ animation:none; }
  }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }

  img.clickable{ cursor:zoom-in; transition:transform .15s ease; }
  img.clickable:hover{ transform:scale(1.02); }

  #lightbox{
    position:fixed; inset:0;
    background:rgba(0,0,0,0.85);
    display:none;
    align-items:center; justify-content:center;
    z-index:1000;
    padding:20px;
  }
  #lightbox.open{ display:flex; }
  #lightbox img{
    max-width:92vw; max-height:90vh;
    border-radius:10px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
  }
  #lightbox .close{
    position:absolute; top:16px; right:22px;
    color:#fff; font-size:34px; line-height:1;
    cursor:pointer; font-family:'Space Mono', monospace;
    opacity:.8; user-select:none;
  }
  #lightbox .close:hover{ opacity:1; }
</style>
</head>

function renderFeed(){
  const feed = document.getElementById('feed');
  feed.innerHTML = "";

  if (POSTS.length === 0){
    feed.innerHTML = '<div class="empty">TodavÃ­a no hay publicaciones.</div>';
    return;
  }

  const sorted = [...POSTS].sort((a,b) => new Date(b.date) - new Date(a.date));

  sorted.forEach((post, i) => {
    const el = document.createElement('article');
    el.className = 'post';
    el.style.animationDelay = (i * 0.05) + 's';

    let badge = "";
    if (i === 0){
      badge = '<span class="latest-badge"><span class="ping"></span>Ãºltimo</span>';
    } else if (post.updated){
      badge = '<span class="latest-badge" style="background:var(--blue);color:#fff;">actualizado</span>';
    }

    const image = post.image
      ? '<div class="post-top"><img class="post-logo clickable" alt="' + escapeHtml(post.title) + '" src="' + escapeHtml(post.image) + '" data-large="' + escapeHtml(post.imageLarge || post.image) + '"></div>'
      : '<div class="post-top"></div>';

    const intro = post.intro
      ? '<div class="blk"><span class="blk-title">' + escapeHtml(post.introLabel || 'Â¿QuÃ© es SMARTCACHE?') + '</span><p>' + escapeHtml(post.intro) + '</p></div>'
      : '';

    const features = (post.features || [])
      .map(f => '<div class="feat"><h4>' + escapeHtml(f.title) + '</h4><p>' + escapeHtml(f.text) + '</p></div>')
      .join('');

      .map(b => '<div class="blk"><span class="blk-title">' + escapeHtml(b.heading) + '</span><p>' + escapeHtml(b.text) + '</p></div>')
      .join('');

          '</div>' +
          '<div class="post-title">' + escapeHtml(post.title) + '</div>' +
          intro +
          (features ? '<div class="features">' + features + '</div>' : '') +
          blocks +
          '<div class="post-footer">' +
            '<a class="download-btn" href="' + escapeHtml(post.downloadUrl) + '">' + escapeHtml(post.downloadLabel) + ' â†“</a>' +

          '</div>' +

}

function formatDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

/* Lightbox: abrir imagen en grande al hacer clic */
const lightbox = document.getElementById('lightbox');
const lbImg = lightbox ? lightbox.querySelector('img') : null;

document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('clickable')){
    if (lbImg) lbImg.src = e.target.dataset.large || e.target.src;
    lightbox.classList.add('open');
  } else if (e.target.closest && e.target.closest('#lightbox')){
    lightbox.classList.remove('open');
  }
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') lightbox.classList.remove('open');
});
