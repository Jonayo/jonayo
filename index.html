<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jonayo — SmartCache</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F0EEE6;
    --ink:#1A1B1E;
    --muted:#6B6B63;
    --line:#D8D4C8;
    --accent:#FF5A1F;
    --accent-ink:#FFF3EC;
    --blue:#2451FF;
    --card:#FAF9F5;
    --dark:#08080B;
    --dark-l:#111116;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--blue); text-decoration:none;}

  .hero{
    background:radial-gradient(1200px 600px at 50% -20%, #1c1c24 0%, var(--dark) 60%);
    text-align:center;
    padding:clamp(28px,6vw,48px) 20px clamp(24px,5vw,40px);
    border-bottom:1px solid var(--line);
  }
  .logo-main{
    max-width:560px;
    width:100%;
    height:auto;
    display:block;
    margin:0 auto;
    border-radius:8px;
    box-shadow:0 10px 40px rgba(0,0,0,0.45);
  }
  .tagline{
    margin-top:14px;
    color:#c9c9c3;
    font-size:15px;
    font-family:'Space Mono', monospace;
  }
  .tagline .cursor{
    display:inline-block;
    width:8px; height:14px;
    background:#c9c9c3;
    margin-left:2px;
    vertical-align:-2px;
    animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 50%{opacity:0;} }

  main{
    max-width:720px;
    margin:0 auto;
    padding:clamp(24px,5vw,48px) clamp(20px,6vw,24px) 80px;
  }
  #feed{ display:flex; flex-direction:column; gap:18px; }

  .post{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:0 0 22px;
    overflow:hidden;
    opacity:0;
    transform:translateY(10px);
    animation:rise 0.5s ease forwards;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .post:hover{ border-color:#c7c2b2; box-shadow:0 6px 20px rgba(26,27,30,0.07); }
  @keyframes rise{ to{ opacity:1; transform:translateY(0);} }

  .post-top{
    background:var(--dark);
    padding:26px 22px 8px;
    text-align:center;
    border-bottom:2px solid var(--line);
  }
  .post-logo{
    max-width:280px;
    width:100%;
    height:auto;
    display:block;
    margin:0 auto 18px;
    border-radius:8px;
  }

  .post-body{ padding:20px 24px 0; }

  .post-meta{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Space Mono', monospace;
    font-size:12.5px;
    color:var(--muted);
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:6px;
  }
  .version-tag{
    background:var(--ink);
    color:var(--paper);
    padding:2px 8px;
    border-radius:4px;
    font-weight:700;
  }
  .latest-badge{
    background:var(--accent);
    color:var(--accent-ink);
    padding:2px 8px;
    border-radius:4px;
    font-weight:700;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .latest-badge .ping{
    width:6px; height:6px; border-radius:50%;
    background:var(--accent-ink);
    animation:blink 1s steps(1) infinite;
  }

  .post-title{
    font-size:22px;
    font-weight:700;
    margin-top:6px;
    letter-spacing:-0.01em;
    text-align:center;
  }
  .post-desc p{
    margin-top:12px;
    color:#3a3a37;
    font-size:15px;
  }
  .why-block{
    margin-top:18px;
    padding:14px 16px;
    border-left:3px solid var(--accent);
    background:#F4EFE1;
    border-radius:0 8px 8px 0;
    font-size:14.5px;
    color:#2f2f2c;
  }
  .why-label{
    display:inline-block;
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:4px;
  }
  .why-block p{ margin-top:2px; }

  .post-footer{
    margin-top:20px;
    padding:0 24px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }
  .download-btn{
    font-family:'Space Mono', monospace;
    font-weight:700;
    font-size:13.5px;
    background:var(--accent);
    color:var(--accent-ink);
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:background .15s ease, transform .15s ease;
    box-shadow:0 4px 14px rgba(255,90,31,0.25);
  }
  .download-btn:hover{ background:#e34a10; transform:translateY(-1px); }

  footer{
    text-align:center;
    padding:30px 20px 50px;
    color:var(--muted);
    font-family:'Space Mono', monospace;
    font-size:12px;
  }

  .empty{
    font-family:'Space Mono', monospace;
    color:var(--muted);
    padding:40px 0;
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    .post{ animation:none; opacity:1; transform:none; }
    .cursor, .ping{ animation:none; }
  }
  :focus-visible{ outline:2px solid var(--blue); outline-offset:2px; }
</style>
</head>
<body>

<header class="hero">
  <img class="logo-main" src="jonayo-logo.png" alt="Jonayo">
  <div class="tagline">software hecho a mano<span class="cursor"></span></div>
</header>

<main>
  <div id="feed"></div>
</main>

<footer>jonayo — actualizado a mano, sin servidores</footer>

<script>
/* ============================================================
   CÓMO PUBLICAR ALGO NUEVO O ACTUALIZAR UNO EXISTENTE
   ------------------------------------------------------------
   Las publicaciones viven en la lista POSTS de abajo (cada una
   es un objeto { ... }). El sitio las muestra solas, ordenadas
   por "date" (la más nueva arriba).

   Campos de cada publicación:
     id          -> texto único que no se repita
     version     -> etiqueta corta (p. ej. "v1.2")
     date        -> "AAAA-MM-DD" (la fecha de la publicación)
     updated     -> true si es una actualización de algo ya publicado
     title       -> título
     image       -> (opcional) nombre del archivo PNG en esta misma carpeta
     description -> texto o lista de párrafos
     why         -> (opcional) bloque "por qué tenerlo"
     downloadUrl -> enlace del botón de descarga
     downloadLabel-> texto del botón

   Para PUBLICAR ALGO NUEVO / MARCAR COMO ACTUALIZADO:
     agregar un bloque o cambiar su date (y updated: true).
     Guardá y hacé commit: el sitio se publica solo.
   ============================================================ */
const POSTS = [
  {
    id: "smartcache",
    version: "v1.2",
    date: "2026-08-06",
    updated: false,
    title: "SmartCache",
    image: "smartcache-logo.png",
    description: [
      "SmartCache es una herramienta para Windows que acelera tu computadora. Detecta tus discos (SSD y HDD) y mueve automáticamente los archivos que más usas al disco más rápido, guardando cachés de forma inteligente.",
      "Funciona en segundo plano, se minimiza en la bandeja y no requiere conocimientos técnicos: elegís tus discos, y SmartCache optimiza el resto."
    ],
    why: "En resumen: menos esperas, discos que duran más y una PC que se siente nueva, sin que tengas que saber nada del sistema.",
    downloadUrl: "https://github.com/Jonayo/smartcache-updates/releases/latest/download/SmartCache.exe",
    downloadLabel: "Descargar la última versión"
  }
];

function renderFeed(){
  const feed = document.getElementById('feed');
  feed.innerHTML = "";

  if (POSTS.length === 0){
    feed.innerHTML = '<div class="empty">Todavía no hay publicaciones.</div>';
    return;
  }

  const sorted = [...POSTS].sort((a,b) => new Date(b.date) - new Date(a.date));

  sorted.forEach((post, i) => {
    const el = document.createElement('article');
    el.className = 'post';
    el.style.animationDelay = (i * 0.05) + 's';

    let badge = "";
    if (i === 0){
      badge = '<span class="latest-badge"><span class="ping"></span>último</span>';
    } else if (post.updated){
      badge = '<span class="latest-badge" style="background:var(--blue);color:#fff;">actualizado</span>';
    }

    const image = post.image
      ? '<div class="post-top"><img class="post-logo" alt="' + escapeHtml(post.title) + '" src="' + escapeHtml(post.image) + '"></div>'
      : '<div class="post-top"></div>';

    const desc = (post.description || [])
      .map(t => '<p>' + escapeHtml(t) + '</p>').join('');

    const why = post.why
      ? '<div class="why-block"><span class="why-label">¿Por qué tenerlo?</span><p>' + escapeHtml(post.why) + '</p></div>'
      : '';

    el.innerHTML =
      image +
      '<div class="post-body">' +
        '<div class="post-meta">' +
          '<span class="version-tag">' + escapeHtml(post.version) + '</span>' + badge + '<span>' + formatDate(post.date) + '</span>' +
        '</div>' +
        '<div class="post-title">' + escapeHtml(post.title) + '</div>' +
        '<div class="post-desc">' + desc + '</div>' +
        why +
        '<div class="post-footer">' +
          '<a class="download-btn" href="' + escapeHtml(post.downloadUrl) + '">' + escapeHtml(post.downloadLabel) + ' ↓</a>' +
        '</div>' +
      '</div>';

    feed.appendChild(el);
  });
}

function formatDate(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return d.toLocaleDateString('es-ES', { day:'numeric', month:'short', year:'numeric' });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

renderFeed();
</script>

</body>
</html>
